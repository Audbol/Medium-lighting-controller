[package]
name = "stage-lite"
version = "0.2.0"
edition = "2024"
description = "A 24-fixture HSI lighting console for LED rigs that works like a Jands Stage CL, with Art-Net, sACN and ENTTEC output"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit", "clipboard"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false, optional = true }
cpal = { version = "0.18.2", optional = true }

[features]
default = ["enttec"]
# ENTTEC DMX USB Pro output over a serial port.
enttec = ["dep:serialport"]
# Audio triggering from the default microphone. Needs ALSA headers on Linux.
audio = ["dep:cpal"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
